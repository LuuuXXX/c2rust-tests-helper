name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Job 1: standard Rust build + unit tests + lint ──────────────────────────
  build-and-test:
    name: Build, test, and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  # ── Job 2: cJSON end-to-end (real pipeline) ──────────────────────────────────
  #
  # Runs the full intended workflow against the real open-source cJSON project:
  #
  #   1. Install c2rust-demo (https://github.com/LuuuXXX/c2rust-demo)
  #   2. Clone cJSON (https://github.com/DaveGamble/cJSON)
  #   3. c2rust-demo init -- make -C build
  #        → captures cJSON C compilation via LD_PRELOAD hook
  #        → runs clang AST analysis + bindgen
  #        → emits .c2rust/<feature>/meta/init-interface-report.md
  #   4. c2rust-tests-helper discover  →  find test_ functions in C test files
  #   5. c2rust-tests-helper map       →  map each test to interface symbols
  #
  # Note: the real cJSON test suite uses `static void cjson_xxx_should_yyy()`
  # naming which does not follow the test_ heuristic this tool targets.
  # The C test files in examples/cjson/tests/ are purpose-written to demonstrate
  # the tool's conventions and are used for steps 4 and 5.
  #
  cjson-end-to-end:
    name: cJSON end-to-end (real pipeline)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      # ── Install system prerequisites ────────────────────────────────────────
      - name: Install system dependencies (clang, cmake, make)
        run: sudo apt-get update && sudo apt-get install -y clang cmake make

      # ── Cache cargo registry / git sources ─────────────────────────────────
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-

      # c2rust-demo commit to pin against — bump this SHA when updating the tool
      # Latest: 91e76bce (2026-05-07 "补全接口测试")
      - name: Set c2rust-demo revision
        run: echo "C2RUST_DEMO_REV=91e76bce9e3801c278e61e17a73b38a2e23913d8" >> "$GITHUB_ENV"

      # bindgen-cli is required by c2rust-demo's init split (clang AST → Rust)
      - name: Cache bindgen-cli binary
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bindgen
          key: ${{ runner.os }}-bindgen-cli-v1

      - name: Install bindgen-cli
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: cargo install bindgen-cli

      # c2rust-demo must be built from source, not installed via `cargo install`.
      #
      # c2rust-demo's hook_dir() locates hook/Makefile by walking up from the
      # running binary's location.  When the binary lives at:
      #   $HOME/c2rust-demo-src/target/release/c2rust-demo
      # it walks: target/release → target → $HOME/c2rust-demo-src
      # and finds $HOME/c2rust-demo-src/hook/Makefile  ✓
      #
      # `cargo install --git` puts the binary in ~/.cargo/bin where there is no
      # adjacent hook/ directory, causing the "hook/ directory not found" error.
      #
      # NOTE: GitHub Actions does NOT expand `~` in `working-directory:`, so we
      # use `$HOME` (or inline `cd "$HOME/..."`) for all paths under the home dir.
      - name: Clone c2rust-demo at pinned revision
        run: |
          git clone https://github.com/LuuuXXX/c2rust-demo.git ~/c2rust-demo-src
          cd ~/c2rust-demo-src && git checkout "$C2RUST_DEMO_REV"

      - name: Build c2rust-demo
        run: cd "$HOME/c2rust-demo-src" && cargo build --release

      # Put the freshly-built binary on PATH.
      - name: Add c2rust-demo to PATH
        run: echo "$HOME/c2rust-demo-src/target/release" >> "$GITHUB_PATH"

      # ── Build c2rust-tests-helper ───────────────────────────────────────────
      - name: Build c2rust-tests-helper
        run: cargo build --release

      # ── Step 1: run c2rust-demo init on real cJSON ──────────────────────────
      - name: Clone real cJSON from GitHub
        run: git clone --depth=1 https://github.com/DaveGamble/cJSON.git /tmp/cjson

      - name: Configure cJSON build with cmake
        run: cmake -S /tmp/cjson -B /tmp/cjson/build -DCMAKE_BUILD_TYPE=Release

      # c2rust-demo init:
      #   - builds hook/libhook.so to intercept gcc/clang during make
      #   - runs  make -C build  with LD_PRELOAD=libhook.so
      #   - performs clang AST analysis and bindgen on captured .c2rust files
      #   - writes  /tmp/cjson/.c2rust/default/meta/init-interface-report.md
      - name: Run c2rust-demo init on cJSON
        working-directory: /tmp/cjson
        run: c2rust-demo init -- make -C build

      - name: Locate generated interface report
        run: |
          REPORT=$(find /tmp/cjson/.c2rust -name "init-interface-report.md" | head -1)
          if [ -z "$REPORT" ]; then
            echo "ERROR: init-interface-report.md not found — dumping .c2rust tree:"
            find /tmp/cjson/.c2rust -type f || true
            exit 1
          fi
          echo "INTERFACE_REPORT=$REPORT" >> "$GITHUB_ENV"
          echo "Found interface report: $REPORT"

      - name: Show interface symbols (c2rust-demo output)
        run: |
          echo "=== Interface symbols generated by c2rust-demo init ==="
          ./target/release/c2rust-tests-helper interface --report "$INTERFACE_REPORT"

      # ── Step 2: discover C tests ─────────────────────────────────────────────
      # examples/cjson/tests/ contains purpose-written C test files that follow
      # the test_ naming convention expected by this tool.
      - name: Discover C tests
        run: |
          ./target/release/c2rust-tests-helper discover \
            --dir examples/cjson/tests \
            --output /tmp/cjson-discovery.md
          echo "--- discovery report ---"
          cat /tmp/cjson-discovery.md

      - name: Verify discovery report (15 test functions)
        run: |
          grep -q "test_parse_basic"           /tmp/cjson-discovery.md
          grep -q "test_parse_array"           /tmp/cjson-discovery.md
          grep -q "test_parse_and_print"       /tmp/cjson-discovery.md
          grep -q "test_create_null"           /tmp/cjson-discovery.md
          grep -q "test_create_object"         /tmp/cjson-discovery.md
          grep -q "test_create_item_reference" /tmp/cjson-discovery.md
          grep -q "| total C tests | 15 |"    /tmp/cjson-discovery.md
          echo "✓ All 15 representative C test functions discovered"

      # ── Step 3: map C tests → interface symbols ──────────────────────────────
      # Uses the interface report generated by c2rust-demo above (not the
      # bundled example) so the mapping reflects real c2rust-demo output.
      - name: Map C tests to cJSON interface candidates
        run: |
          ./target/release/c2rust-tests-helper map \
            --report "$INTERFACE_REPORT" \
            --dir     examples/cjson/tests \
            --output  /tmp/cjson-map.md
          echo "--- map report ---"
          cat /tmp/cjson-map.md

      - name: Verify mapping — cJSON API symbols appear
        run: |
          grep -q "cJSON_Parse"      /tmp/cjson-map.md
          grep -q "cJSON_CreateNull" /tmp/cjson-map.md
          grep -q "cJSON_Delete"     /tmp/cjson-map.md
          echo "✓ Expected cJSON interface symbols found in mapping report"

      - name: Verify mapping — per-function isolation
        run: |
          # test_create_null only calls cJSON_CreateNull + cJSON_Delete;
          # it must NOT match cJSON_Parse (which lives in test_parse_* bodies).
          if grep "^| test_create_null " /tmp/cjson-map.md | grep -q "cJSON_Parse"; then
            echo "✗ per-function isolation broken: test_create_null matched cJSON_Parse"
            exit 1
          fi
          # test_parse_basic only calls cJSON_Parse + cJSON_GetObjectItem + cJSON_Delete;
          # it must NOT match cJSON_CreateNull (which lives in test_create_null body).
          if grep "^| test_parse_basic " /tmp/cjson-map.md | grep -q "cJSON_CreateNull"; then
            echo "✗ per-function isolation broken: test_parse_basic matched cJSON_CreateNull"
            exit 1
          fi
          echo "✓ Per-function candidate isolation verified"

      - name: Verify mapping — test function count
        run: |
          grep -q "| total C tests | 15 |" /tmp/cjson-map.md
          echo "✓ Summary count verified (15 test functions mapped)"
