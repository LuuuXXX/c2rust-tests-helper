version: 1

project:
  feature: default

# Optional test commands used by `verify`.
# - `c` is executed from project.root.
# - `rust` is executed from project.root and can be any complete Rust test command.
#   If omitted, `verify` falls back to running `cargo test` in `.c2rust/<feature>/rust`.
test_commands:
  c: "make test"
  rust: "cargo test --manifest-path .c2rust/default/rust/Cargo.toml"

discovery:
  paths:
    - tests/c
  extensions:
    - c
  patterns:
    - regex: 'void\s+(test_\w+)\s*\('
      framework: custom

# Generated and updated by `c2rust-tests-helper discover`.
# Users normally only edit `status`, `rust_tests`, `contract`, and `notes`.
# `selected_file` / `module` / `symbols` are derived from `.c2rust/<feature>/`
# when possible.
tests: []
